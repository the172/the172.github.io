name: Auto Update Articles

on:
  schedule:
    - cron: '0 0 * * 1'        # every Monday 00:00 UTC (Sunday 8pm ET)
  push:
    branches: [main]           # redeploy whenever you edit the site
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run crawler
        run: python scripts/update_articles.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/articles.js
          git diff --staged --quiet || (git commit -m "Auto-update articles.js [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
